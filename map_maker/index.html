<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indoor Map Maker & Mesh Editor</title>
  <link rel="stylesheet" href="./src/css/main.css">
  <script type="module" src="./src/js/app.js"></script>
</head>
<body>
  <div id="app">
    <!-- Navbar Header -->
    <header class="navbar">
      <div class="brand">
        <div class="brand-icon">M</div>
        <div class="brand-title">Map Maker Mesh Studio</div>
      </div>
      <div class="nav-actions">
        <input type="file" id="db-file-input" accept=".db,.sqlite,.sqlite3" style="display: none;">
        <input type="file" id="json-file-input" accept=".json,.mapproj" style="display: none;">
        <input type="file" id="bg-image-input" accept="image/*" style="display: none;">
        <input type="file" id="project-file-input" accept=".mapproj,.json" style="display: none;">

        <button id="btn-load-db" class="btn">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
          Load DB File
        </button>

        <button id="btn-fetch-api" class="btn">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
          Fetch API
        </button>

        <button id="btn-import-json" class="btn">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
          Import JSON
        </button>

        <div class="tool-divider"></div>

        <button id="btn-save-project" class="btn">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
          Save Project
        </button>

        <button id="btn-open-project" class="btn">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
          Open Project
        </button>

        <div class="tool-divider"></div>

        <button id="btn-export-json" class="btn btn-success">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          Export Map JSON
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace">
      <div id="canvas-container">
        <canvas id="mesh-canvas"></canvas>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state">
          <div class="empty-state-card">
            <div class="empty-state-icon">M</div>
            <h2>No map loaded</h2>
            <p>Load the backend database or fetch the map from the API to start editing the node mesh.</p>
            <div class="empty-state-actions">
              <button id="empty-load-db" class="btn btn-primary">Load DB File</button>
              <div class="empty-api">
                <input type="url" id="empty-api-url" class="form-input" value="http://localhost:8080/api/map" placeholder="Backend API URL">
                <button id="empty-fetch-api" class="btn">Fetch API</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Status Chip -->
        <div id="status-chip" class="status-chip">
          <span id="status-floor">Floor 1</span>
          <span class="status-sep">·</span>
          <span id="status-zoom">100%</span>
          <span class="status-sep">·</span>
          <span id="status-saved">Unsaved</span>
        </div>
      </div>

      <!-- Floating Tools Bar -->
      <div class="tools-bar">
        <button id="tool-select" class="tool-btn active" title="Select & Move (V)">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5"></path></svg>
        </button>
        <button id="tool-edge" class="tool-btn" title="Add Edge Connection (E)">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
        </button>
        <button id="tool-add-node" class="tool-btn" title="Add Node (N)">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </button>
        <div class="tool-divider"></div>
        <button id="tool-snap" class="tool-btn active" title="Toggle Grid Snap (S)">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <button id="tool-fit" class="tool-btn" title="Fit View (0)">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V6a2 2 0 012-2h2M4 16v2a2 2 0 002 2h2m8-16h2a2 2 0 012 2v2m-4 12h2a2 2 0 002-2v-2"></path></svg>
        </button>
        <button id="tool-delete" class="tool-btn" title="Delete Selected (Del)">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
      </div>

      <!-- Sidebar Inspector -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title">Inspector</div>
        </div>

        <div class="sidebar-body">
          <div class="form-group">
            <label class="form-label">Floor Layer</label>
            <div id="floor-tabs" class="floor-tabs">
              <!-- Floor tabs dynamically generated -->
            </div>
          </div>

          <div id="node-props-form" style="opacity: 0.4; pointer-events: none;">
            <div class="form-group">
              <label class="form-label">Node ID</label>
              <input type="text" id="prop-node-id" class="form-input" readonly>
            </div>

            <div class="form-group">
              <label class="form-label">Name / Label</label>
              <input type="text" id="prop-node-name" class="form-input" placeholder="e.g. Lab 201">
            </div>

            <div class="form-group">
              <label class="form-label">Floor Number</label>
              <select id="prop-node-floor" class="form-select"></select>
            </div>

            <div class="form-group">
              <label class="form-label">Location Type</label>
              <select id="prop-node-type" class="form-select">
                <option value="corridor">Corridor Junction</option>
                <option value="room">Room / Lab</option>
                <option value="stair">Stairs / Elevator</option>
                <option value="entrance">Building Entrance</option>
              </select>
            </div>

            <div style="display: flex; gap: 10px;">
              <div class="form-group" style="flex: 1;">
                <label class="form-label">X Pos</label>
                <input type="number" id="prop-node-x" class="form-input" readonly>
              </div>
              <div class="form-group" style="flex: 1;">
                <label class="form-label">Y Pos</label>
                <input type="number" id="prop-node-y" class="form-input" readonly>
              </div>
            </div>
          </div>

          <div id="edge-props-form" style="display: none;">
            <hr style="border: none; border-top: 1px solid var(--bg-card-border); margin: 16px 0 20px;">
            <div class="form-group">
              <label class="form-label">Edge</label>
              <input type="text" id="prop-edge-id" class="form-input" readonly>
            </div>
            <div style="display: flex; gap: 10px;">
              <div class="form-group" style="flex: 1;">
                <label class="form-label">Steps</label>
                <input type="number" id="prop-edge-steps" class="form-input" min="1">
              </div>
              <div class="form-group" style="flex: 1;">
                <label class="form-label">Direction</label>
                <select id="prop-edge-direction" class="form-select">
                  <option value="N">North</option>
                  <option value="NE">North-East</option>
                  <option value="E">East</option>
                  <option value="SE">South-East</option>
                  <option value="S">South</option>
                  <option value="SW">South-West</option>
                  <option value="W">West</option>
                  <option value="NW">North-West</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Auto-compute</label>
              <button id="btn-edge-auto" class="btn" style="width: 100%; justify-content: center;">
                Recompute steps & direction from layout
              </button>
            </div>
            <button id="btn-delete-edge" class="btn btn-danger" style="width: 100%; justify-content: center;">
              Delete Edge
            </button>
          </div>

          <hr style="border: none; border-top: 1px solid var(--bg-card-border); margin: 20px 0;">

          <div class="form-group">
            <label class="form-label">Floor Plan Image Overlay</label>
            <button onclick="document.getElementById('bg-image-input').click()" class="btn" style="width: 100%; justify-content: center;">
              Upload Blueprint Image
            </button>
          </div>

          <div class="form-group">
            <label class="form-label">Backend API URL</label>
            <div style="display: flex; gap: 8px;">
              <input type="url" id="api-url-input" class="form-input" value="http://localhost:8080/api/map">
              <button id="btn-fetch-api-2" class="btn" style="white-space: nowrap;">Fetch</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Project</label>
            <div style="display: flex; gap: 8px;">
              <button id="btn-save-project-2" class="btn" style="flex: 1; justify-content: center;">Save</button>
              <button id="btn-open-project-2" class="btn" style="flex: 1; justify-content: center;">Open</button>
            </div>
          </div>

          <div class="stats-badge">
            <span>Total Nodes:</span>
            <span id="stat-nodes-count" class="stats-value">0</span>
          </div>
          <div class="stats-badge">
            <span>Total Mesh Edges:</span>
            <span id="stat-edges-count" class="stats-value">0</span>
          </div>
        </div>
      </aside>
    </main>
  </div>
</body>
</html>
