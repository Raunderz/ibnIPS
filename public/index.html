<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KIIT Auth</title>

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
  ></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 25px;
    }

    #result {
      margin-top: 25px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .key {
      background: #f4f4f4;
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      word-break: break-all;
    }

    button {
      padding: 10px 16px;
      margin-top: 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>KIIT Auth</h1>

    <p>Sign in using your KIIT Google account.</p>

    <div id="google-signin"></div>

    <div id="result"></div>
  </div>

  <script nonce="__CSP_NONCE__">
    const GOOGLE_CLIENT_ID = __GOOGLE_CLIENT_ID__;

    let shouldRotate = false;

    async function handleGoogleResponse(response) {
      try {
        const result = document.getElementById('result');

        result.textContent = 'Signing in...';

        const apiResponse = await fetch('/auth/google', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            credential: response.credential,
            rotate: shouldRotate
          })
        });

        const data = await apiResponse.json();

        if (!apiResponse.ok) {
          result.textContent = data.error || 'Authentication failed';
          return;
        }

        shouldRotate = false;

        let html = `
          <h2>Welcome ${escapeHtml(data.user.name || '')}</h2>
          <p>Email: ${escapeHtml(data.user.email)}</p>
        `;

        if (data.apiKey) {
          html += `
            <h3>Your API Key</h3>

            <p>
              <strong>Save this key now.</strong>
              It will not be shown again.
            </p>

            <div class="key">
              ${escapeHtml(data.apiKey)}
            </div>

            <p>
              Prefix: ${escapeHtml(data.apiKeyPrefix)}
            </p>
          `;
        } else {
          html += `
            <p>
              Existing API key:
              <strong>${escapeHtml(data.apiKeyPrefix)}</strong>
            </p>

            <button id="rotate-button">
              Rotate API Key
            </button>
          `;
        }

        result.innerHTML = html;

        const rotateButton = document.getElementById('rotate-button');

        if (rotateButton) {
          rotateButton.addEventListener('click', rotateKey);
        }

      } catch (error) {
        console.error(error);

        document.getElementById('result').textContent =
          'Something went wrong.';
      }
    }

    function rotateKey() {
      shouldRotate = true;

      if (window.google?.accounts?.id) {
        window.google.accounts.id.prompt();
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function initializeGoogleSignIn(attempt = 0) {
      if (!window.google?.accounts?.id) {
        /*
         * Bounded retry: ad blockers and offline networks can stop the GIS
         * script from ever loading, and an unbounded poll would spin forever
         * with no way for the user to tell what went wrong.
         */
        if (attempt >= 50) {
          const result = document.getElementById('result');
          result.textContent =
            'Could not load Google Sign-In. Check your connection or content blocker, then reload.';
          return;
        }

        setTimeout(() => initializeGoogleSignIn(attempt + 1), 100);
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,

        callback: handleGoogleResponse,

        auto_select: false
      });

      google.accounts.id.renderButton(
        document.getElementById('google-signin'),
        {
          type: 'standard',
          size: 'large',
          theme: 'outline',
          text: 'sign_in_with',
          shape: 'rectangular'
        }
      );
    }

    initializeGoogleSignIn();
  </script>

</body>
</html>
